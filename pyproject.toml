[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-index-mcp"
version = "0.1.0"
description = "Persistent auto-index MCP server for low-context codebase navigation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.13.0,<2",
    "watchdog>=4.0.0",
    "pathspec>=0.12.1,<2",
    "ripgrep>=14.1.0,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.13", "psutil>=6"]
semantic = [
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
]

[project.scripts]
auto-index-mcp = "auto_index_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/auto-index-mcp/models/minilm-onnx" = ["models/minilm-onnx/model.onnx", "models/minilm-onnx/tokenizer.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Active suite lives in tests/. oldtest/ is archived history and is not collected.
# reference/ and third-party/ carry foreign test trees that must never be collected.
testpaths = ["tests"]
norecursedirs = ["reference", "third-party", "models", "dist", ".auto-index-mcp"]
markers = [
    "allow_default_embedder: allow a test to use the production embedding backend factory",
    "smoke: end-to-end smoke checks that rebuild the project index",
]
